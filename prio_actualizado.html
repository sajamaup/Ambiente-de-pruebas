
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fichas Técnicas IAE · CENGOB Bolivia</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --vd:#102d2e; --vd2:#1a4a4c; --vd3:#0d2526;
  --or:#c9a751; --or2:#f0e4b8;
  --sv:#27AE60; --sa:#F0A500; --sr:#D93025; --sc:#888;
  --bg:#eef1ee; --wh:#fff; --bd:#d0d8d0; --tx:#102d2e;
  --gr:#f4f7f4; --gr2:#e8ede8; --sb:300px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:'Barlow',sans-serif;font-size:14px;display:flex;flex-direction:column}
.hdr{background:var(--vd3);padding:10px 20px;display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--or);flex-shrink:0}
.hdr-logo{height:44px;width:auto;max-width:200px;border-radius:5px;object-fit:contain;flex-shrink:0}
.hdr-title{color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:.4px}
.hdr-sub{color:var(--or);font-size:.68rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-top:2px}
.hdr-badge{margin-left:auto;background:rgba(201,167,81,.12);border:1px solid rgba(201,167,81,.28);border-radius:8px;padding:5px 14px;text-align:center;flex-shrink:0}
.hdr-n{color:var(--or);font-family:'Barlow Condensed',sans-serif;font-size:1.7rem;font-weight:900;line-height:1}
.hdr-l{color:rgba(255,255,255,.4);font-size:.58rem;letter-spacing:.6px;text-transform:uppercase}
.layout{display:flex;flex:1;min-height:0}
.sidebar{width:var(--sb);min-width:var(--sb);background:var(--vd);display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.07);overflow:hidden}
.sb-top{padding:12px 14px 8px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.sb-search{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:8px 12px;color:#fff;font-family:'Barlow',sans-serif;font-size:.82rem;transition:all .15s}
.sb-search::placeholder{color:rgba(255,255,255,.3)}
.sb-search:focus{outline:none;border-color:var(--or);background:rgba(255,255,255,.11)}
.sb-meta{color:rgba(255,255,255,.3);font-size:.65rem;letter-spacing:.3px;margin-top:5px;padding:0 1px}
.sb-scroll{flex:1;overflow-y:auto}
.sb-scroll::-webkit-scrollbar{width:3px}
.sb-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.mg{border-bottom:1px solid rgba(255,255,255,.04)}
.mg-btn{width:100%;background:none;border:none;text-align:left;padding:9px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:8px;transition:background .12s}
.mg-btn:hover{background:rgba(255,255,255,.05)}
.mg-btn.has-selected{background:rgba(201,167,81,.07)}
.mg-arr{color:var(--or);font-size:.65rem;flex-shrink:0;margin-top:3px;transition:transform .18s}
.mg-arr.open{transform:rotate(90deg)}
.mg-name{color:rgba(255,255,255,.8);font-family:'Barlow Condensed',sans-serif;font-size:.85rem;font-weight:600;letter-spacing:.25px;flex:1;line-height:1.3}
.mg-ct{background:rgba(201,167,81,.14);color:var(--or);font-size:.62rem;font-weight:700;border-radius:9px;padding:1px 6px;flex-shrink:0;margin-top:2px}
.mg-items{display:none}
.mg-items.open{display:block}
.ii{display:flex;align-items:center;gap:7px;padding:7px 14px 7px 26px;cursor:pointer;transition:background .1s;border-left:3px solid transparent}
.ii:hover{background:rgba(255,255,255,.04)}
.ii.sel{background:rgba(201,167,81,.1);border-left-color:var(--or)}
.ii-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ii-id{color:var(--or);font-family:'Barlow Condensed',sans-serif;font-size:.68rem;font-weight:700;white-space:nowrap;flex-shrink:0}
.ii-name{color:rgba(255,255,255,.65);font-size:.74rem;line-height:1.3;flex:1;min-width:0}
.ii-pct{color:rgba(255,255,255,.35);font-size:.68rem;white-space:nowrap;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px 30px;min-width:0}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#aaa;gap:14px}
.empty-ic{font-size:3rem;opacity:.35}
.fh{background:var(--vd);border-radius:14px;padding:22px 26px;margin-bottom:14px}
.fh-top{display:flex;align-items:flex-start;gap:22px}
.fh-main{flex:1;min-width:0}
.fh-row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.fh-id{color:var(--or);font-family:'Barlow Condensed',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.9px;background:rgba(201,167,81,.12);border:1px solid rgba(201,167,81,.22);border-radius:4px;padding:2px 8px}
.fh-eje{color:rgba(255,255,255,.45);font-size:.72rem;font-weight:500}
.fh-prio{color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:1.35rem;font-weight:700;line-height:1.2;margin-bottom:4px}
.fh-intv{color:rgba(255,255,255,.55);font-size:.83rem;margin-bottom:10px;line-height:1.4}
.fh-tags{display:flex;gap:6px;flex-wrap:wrap}
.fh-tag{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:5px;padding:3px 9px;font-size:.7rem;color:rgba(255,255,255,.7);font-weight:500}
.fh-iae-box{text-align:center;min-width:120px;padding:2px 0;flex-shrink:0}
.fh-iae-n{color:var(--or);font-family:'Barlow Condensed',sans-serif;font-size:3rem;font-weight:900;line-height:1}
.fh-iae-sup{font-size:1.2rem;vertical-align:super}
.fh-iae-lbl{color:rgba(255,255,255,.38);font-size:.63rem;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.fh-subs{color:rgba(255,255,255,.6);font-size:.76rem;margin-top:5px;font-weight:600}
.fh-sem{margin-top:8px;display:flex;justify-content:center}
.fh-obj{margin-top:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px;display:flex;gap:10px;align-items:flex-start}
.fh-obj-lbl{color:var(--or);font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;margin-top:1px;flex-shrink:0}
.fh-obj-txt{color:rgba(255,255,255,.72);font-size:.82rem;line-height:1.5}
.sem{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:4px 11px;font-size:.72rem;font-weight:700;letter-spacing:.3px}
.sem-V{background:rgba(39,174,96,.18);color:#2dcc70;border:1px solid rgba(39,174,96,.3)}
.sem-A{background:rgba(240,165,0,.18);color:#f0a500;border:1px solid rgba(240,165,0,.35)}
.sem-R{background:rgba(217,48,37,.18);color:#e84040;border:1px solid rgba(217,48,37,.3)}
.sem-N{background:rgba(30,30,30,.35);color:#ccc;border:1px solid rgba(80,80,80,.4)}
.sem-B{background:rgba(220,220,220,.15);color:#bbb;border:1px solid rgba(180,180,180,.3)}
.sem-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}
.prog{background:var(--vd2);border-radius:10px;padding:14px 20px;margin-bottom:14px}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prog-lbl{color:rgba(255,255,255,.45);font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.prog-val{color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:700}
.prog-bar{background:rgba(255,255,255,.09);border-radius:100px;height:12px;overflow:hidden}
.pf{height:100%;border-radius:100px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.pf-V{background:linear-gradient(90deg,#1e9c52,#42d87a)}
.pf-N{background:rgba(60,60,60,.4)}
.pf-B{background:rgba(180,180,180,.2)}
.pf-A{background:linear-gradient(90deg,#c98000,#f0c040)}
.pf-R{background:linear-gradient(90deg,#b02018,#e05048)}
.pf-N{background:rgba(140,140,140,.35)}
.prog-stats{display:flex;gap:20px;margin-top:10px}
.ps{text-align:center}
.ps-n{color:var(--or);font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;font-weight:900;line-height:1}
.ps-l{color:rgba(255,255,255,.38);font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.et-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.et-ttl{font-family:'Barlow Condensed',sans-serif;font-size:.76rem;font-weight:700;color:var(--tx);text-transform:uppercase;letter-spacing:.6px}
.et-acts{display:flex;gap:5px}
.btn-xs{background:var(--wh);border:1.5px solid var(--bd);border-radius:5px;padding:3px 10px;font-size:.67rem;font-weight:700;color:var(--vd);cursor:pointer;letter-spacing:.3px;text-transform:uppercase;transition:all .15s}
.btn-xs:hover{background:var(--gr2);border-color:var(--vd2)}
.eta-card{background:var(--wh);border:1.5px solid var(--bd);border-radius:11px;margin-bottom:8px;overflow:hidden}
.eta-card:hover{box-shadow:0 2px 10px rgba(16,45,46,.07)}
.eta-row{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;background:var(--gr);transition:background .12s}
.eta-row:hover{background:var(--gr2)}
.eta-badge{background:var(--vd);color:var(--or);font-family:'Barlow Condensed',sans-serif;font-size:.67rem;font-weight:700;border-radius:4px;padding:3px 8px;white-space:nowrap;letter-spacing:.4px;flex-shrink:0}
.eta-icon{font-size:.9rem;width:22px;text-align:center;flex-shrink:0}
.eta-name{flex:1;font-weight:600;font-size:.88rem;color:var(--tx);line-height:1.3}
.eta-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.eta-mini{width:64px;height:4px;background:rgba(16,45,46,.1);border-radius:2px;overflow:hidden;flex-shrink:0}
.eta-mini-f{height:100%;border-radius:2px}
.emf-V{background:var(--sv)}.emf-N{background:#444}.emf-B{background:#ddd} .emf-A{background:var(--sa)} .emf-R{background:var(--sr)} .emf-N{background:#ccc}
.eta-prog{font-size:.7rem;color:#5a7060;font-weight:600;white-space:nowrap}
.eta-dates{font-size:.67rem;color:#8a9e8a;white-space:nowrap}
.eta-chev{color:#b0bab0;font-size:.7rem;transition:transform .18s;flex-shrink:0}
.eta-row.open .eta-chev{transform:rotate(180deg)}
.subs{display:none;border-top:1.5px solid var(--bd)}
.subs.open{display:block}
.subs table{width:100%;border-collapse:collapse;font-size:.8rem}
.subs th{background:var(--gr);color:#5a7060;font-weight:700;text-align:left;padding:7px 13px;font-size:.66rem;text-transform:uppercase;letter-spacing:.4px;border-bottom:1.5px solid var(--bd)}
.subs th.c{text-align:center;width:38px}
.subs th.wd{width:92px}
.subs th.wr{width:170px}
.subs td{padding:9px 13px;border-bottom:1px solid #eef1ee;vertical-align:top;line-height:1.4}
.subs tr:last-child td{border-bottom:none}
.subs tr:hover td{background:#f7fbf7}
.subs td.c{text-align:center;font-size:.9rem}
.s-num{color:#bbb;font-size:.65rem;font-weight:600;display:block;margin-bottom:1px}
.s-name{color:var(--tx);font-weight:500}
.s-resp{color:#5a7060;font-size:.73rem;line-height:1.3}
.s-date{color:#8a9e8a;font-size:.72rem;white-space:nowrap}
tr.done-row{background:#fafffe}


/* Ministry rows */
.fh-mins{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.fh-min-row{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.fh-min-lbl{color:var(--or);font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;margin-top:2px;min-width:170px;flex-shrink:0}
.fh-min-val{color:#fff;font-size:.88rem;font-weight:600;line-height:1.3}
.fh-conc-row{}
.fh-conc-val{color:rgba(255,255,255,.65);font-size:.8rem;line-height:1.4}

/* Fecha validación */
.fh-fecha{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);text-align:center}
.fh-fecha-lbl{display:block;color:rgba(255,255,255,.38);font-size:.6rem;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.fh-fecha-val{display:block;color:var(--or);font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;font-weight:700;letter-spacing:.5px}
.fh-fecha-none .fh-fecha-none-val{display:block;color:var(--sr);font-family:'Barlow Condensed',sans-serif;font-size:.85rem;font-weight:700;letter-spacing:.3px}

.hdr-cut{margin-left:12px;border-left:1px solid rgba(201,167,81,.25);padding-left:14px;flex-shrink:0}
.hdr-cut-lbl{color:rgba(255,255,255,.4);font-size:.58rem;letter-spacing:.7px;text-transform:uppercase;margin-bottom:2px}
.hdr-cut-val{color:var(--or);font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:.5px;white-space:nowrap}

/* Responsable etapa */
.eta-resp{font-size:.68rem;color:#5a7060;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;flex-shrink:0;padding:2px 7px;background:rgba(16,45,46,.05);border-radius:4px;border:1px solid rgba(16,45,46,.1)}

tr.prog-row{background:#eef4ff}
.et-leg{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:2px 0 10px;padding:0 2px}
.et-leg .lg{display:inline-flex;align-items:center;gap:5px;color:#5a7060;font-size:.66rem;font-weight:600}
.et-leg .lg i{font-style:normal;font-size:.8rem;line-height:1}
</style>
</head>

  {id:'i.2',eje:'Eje 4-5 – Modernización y Transparencia',intv:'Desregulación y desburocratización de normas y procesos · Programa "Tranca Cero" (PTC)',min:'Ministerio de la Presidencia',minConc:'Ministerio de la Presidencia - AGETIC; Ministerio de Relaciones Exteriores; Ministerio de Planificación del Desarrollo y Medio Ambiente; Ministerio de Economía y Finanzas Públicas; Ministerio de Gobierno; Ministerio de Defensa.',ind:'Índice de Implementación Metodológica y Sistemica del Programa "Tranca Cero" – Desregulación, simplificación administrativa y optimización normativa.',meta:'Alcanzar el 100% del proceso: DS N° 5595 promulgado; Reglamento aprobado y vigente; Catálogo Nacional de Trámites, Sistema "Reporta Tu Tranca", Ranking de Simplificación, Certificación Tranca Cero implementados metodológica y sistematicamente.',lb:'(N° etapas ejecutadas / 6) × 100 → 17% (1 de 6 etapas cumplida)',freq:'Mensual',fuentes:'Gaceta Oficial del Estado Plurinacional (DS N° 5595, 30/03/2026); Reglamento (aprobabo por el Comité); CNT – AGETIC; Sistema "Reporta Tu Tranca"; informes VCME; Ranking RK-SIM semestral; Medición de la percepción de la eficiencia de los trámites Gubernamentales.',desc:'Desarrollar la política pública nacional de desregulación, simplificación administrativa y optimización normativa denominada Programa "Tranca Cero", destinada a eliminar barreras burocráticas injustificadas, modernizar la actuación del Órgano Ejecutivo y facilitar el acceso de ciudadanos y empresas a derechos, servicios y actividades económicas. Incluye el Comité Interministerial, el Catálogo Nacional de Trámites, el Sistema "Reporta Tu Tranca", el Ranking de Simplificación Regulatoria, la Certificación "Tranca Cero" y la promoción de la digitalización, interoperabilidad y automatización de tramites y procedimientos.',obj:'Implementar integralmente el Programa "Tranca Cero" como política pública nacional de desregulación y simplificación administrativa, mediante el despliegue metodológico y sis   {id:'i.5',eje:'Eje 7 – Verde y Sostenible',intv:'Proceso saneamiento de tierras (+ modif. Ley INRA)',min:'Ministerio de la Presidencia',minConc:'Ministerio de la Presidencia',ind:'Índice de Avance del Proceso de Saneamiento y Titulación de Tierras',meta:'Alcanzar el 100% del proceso, con títulos entregados masivamente y registros actualizados en DD.RR.',lb:'(N° etapas ejecutadas / 6) × 100 → 0%',freq:'Mensual',fuentes:'Registros INRA; resoluciones aprobadas; estadísticas titulación masiva; inscripciones DD.RR.',desc:'Desarrollar el Proceso de saneamiento de tierras (+ modif. Ley INRA)',obj:'Enfoque privado (Observación técnica en materia de tierras). (i) Constituye el componente de uso interno y reservado del Viceministerio de Tierras. Mediante el análisis automático de sobreposiciones entre parcelas o áreas y las capas oficiales (predios titulados, en proceso de saneamiento, tierras fiscales autorizadas, predios en usufructo, TCO/TIOC, áreas protegidas y reservas forestales), genera reportes técnicos y alertas de sobreposición crítica según condiciones parametrizadas, de uso exclusivo interno para la toma de decisiones técnico-jurídicas del Viceministerio. La información de este enfoque es confidencial y no se expone al ámbito público. (ii) Seguimiento a las Áreas Productivas Agropecuarias Urbanas, orientada a verificar el cumplimiento del uso agropecuario, forestal y/o piscícola por el período mínimo de 15 años conforme al D.S. N° 5065/2023 (ampliación del D.S. N° 1809/2013). Este enfoque aporta al control territorial urbano, una vez aprobada el área urbana con resolución ministerial. (iii) Incorpora, el Módulo de Alertas Tempranas por Focos de Calor, que integra en tiempo real la fuente NASA FIRMS (sensores MODIS/VIIRS) y ejecuta la detección automática de sobreposición entre los focos de calor activos y todas las capas geoespaciales agrarias del sistema, generando un reporte técnico por predio afectado y activando la alerta de sobreposición correspondiente ante cualquier coincidencia. Enfoque público (académico y de homologación de áreas urbanas). (i) La facilitación de información aprobada (reporte perimetral del área urbana homologada) con fines exclusivamente académicos, para apoyar el desarrollo de proyectos de investigación de pregrado y posgrado de las universidades en materia de homologación de áreas urbanas.',fecha:'28/07/2026',prio:'Gestión preventiva de sobreposiciones geoespaciales agrarias, alertas tempranas de conflicto territorial, monitoreo de áreas productivas agropecuarias urbanas y seguridad jurídica en tierras',iae:6.2,subsCum:1,subsTotal:16,ets:['Diseño conceptual y arquitectura técnica del sistema OBSERVATERRA – plataforma geoespacial propia del Viceministerio de Tierras','Parametrización y estandarización del motor de alerta de sobreposición, y desarrollo de la plataforma geoespacial','Implementación del Módulo de Alertas Tempranas por Focos de Calor, con la fuente satelital NASA FIRMS (Fire Information for Resource Management System) y los sensores MODIS/VIIRS, y puesta en operación del sistema: detección automática de sobreposición, emisión de alertas y monitoreo de las APAU – Áreas Productivas Agropecuarias Urbanas.','Calidad, Automatización (QA – Aseguramiento de Calidad) y Seguridad del sistema OBSERVATERRA','Pruebas funcionales, de caja negra y validación con usuarios del sistema OBSERVATERRA – plataforma geoespacial, motor de sobreposiciones y módulo de APAU – Áreas Productivas Agropecuarias Urbanas','Ajustes, mejoras e institucionalización del sistema OBSERVATERRA como plataforma permanente del Viceministerio de Tierras'],etsPer:['✅ Completado','⬜ Pendiente','⬜ Pendiente','⬜ Pendiente','⬜ Pendiente','⬜ Pendiente'],etsPond:[100,100,100,100,100,100],etaSubs:[[{n:'Diseño conceptual, arquitectura técnica y marco metodológico del sistema: modelo de la plataforma geoespacial, definición de capas agrarias (predios titulados, en saneamiento, tierras fiscales autorizadas, usufructo, TCO – Tierra Comu   {id:'i.16',eje:'Eje 2 – Bolivia al Mundo y el mundo a Bolivia',intv:'HUB Viru Viru – Cielos abiertos',min:'Ministerio de Obras Públicas',minConc:'Ministerio de Relaciones Exteriores; Aduana Nacional; Policia Boliviana',ind:'% de Avance del proceso de Implementacion del HUB Viru Viru',meta:'Alcanzar el 100% del proceso, con HUB Viru Viru operativo bajo política de cielos abiertos',lb:'(N° etapas ejecutadas / 6) × 100 → 0%',freq:'Mensual',fuentes:'Informes DGAC; convenios con aerolíneas; reportes operativos Viru Viru',desc:'Habilitar, implementar y poner en operación el HUB aeroportuario Viru Viru, como centro de conexión de vuelos nacionales, regionales e internacionales de pasajeros y carga, bajo una política sostenible y regulada de cielos abiertos, articulada con el sistema de transporte terrestre y, a mediano plazo, ferroviario. El HUB permitirá proyectar a Bolivia como un país integrado al mundo, fortaleciendo el comercio exterior, la atracción de inversiones, el turismo y la generación de empleo, en coherencia con las políticas de desarrollo económico, integración regional y soberanía logística del Estado. La implementación del HUB Viru Viru responde a la necesidad estratégica del Estado Plurinacional de Bolivia de fortalecer su conectividad aérea, logística y comercial, en un contexto de creciente integración regional y demanda de servicios de transporte eficientes. Bolivia presenta una posición geográfica central en Sudamérica que, debidamente aprovechada mediante infraestructura adecuada, regulación moderna y articulación institucional, puede convertirse en un factor clave para mejorar la competitividad del país. La prioridad de esta intervención radica en transformar al Aeropuerto Internacional Viru Viru en un nodo de conexión aérea que permita incrementar el flujo de pasajeros y carga, reducir costos logísticos, diversificar destinos internacionales y consolidar al país como plataforma de integración económica, turística y productiva',obj:'Habilitar, implementar y poner en operación el HUB aeroportuario Viru Viru, como centro de conexión de vuelos nacionales, regionales e internacionales de pasajeros y carga, bajo una política sostenible y regulada de cielos abiertos, articulada con el sistema de transporte terrestre y, a mediano plazo, ferroviario. El HUB permitirá proyectar a Bolivia como un país integrado al mundo, fortaleciendo el comercio exterior, la atracción de inversiones, el turismo y la generación de empleo, en coherencia con las políticas de desarrollo económico, integración regional y soberanía logística del Estado. La implementación del HUB Viru Viru responde a la necesidad estratégica del Estado Plurinacional de Bolivia de fortalecer su conectividad aérea, logística y comercial, en un contexto de creciente integración regional y demanda de servicios de transporte eficientes. Bolivia presenta una posición geográfica central en Sudamérica que, debidamente aprovechada mediante infraestructura adecuada, regulación moderna y articulación institucional, puede convertirse en un factor clave para mejorar la competitividad del país. La prioridad de esta intervención radica en transformar al Aeropuerto Internacional Viru Viru en un nodo de conexión aérea que permita incrementar el flujo de pasajeros y carga, reducir costos logísticos, diversificar destinos internacionales y consolidar al país como plataforma de integración económica, turística y productiva',fecha:'28/07/2026',prio:'HUB Viru Viru – Cielos abiertos',iae:10.5,subsCum:2,subsTotal:19,ets:['Análisis Sectorial','Marco normativo','Implementación','Seguimiento y evaluación'],etsPer:['⬜ Pendiente','⬜ Pendiente','⬜ Pendiente','⬜ Pendiente'],etsPond:[5,25,35,15],etaSubs:[[{n:'Reunión interinstitucional para coordinación de elaboración de la política de cielos abiertos',d:true,resp:'MOPSV; DGAC; NAABOL',desde:'2026-02-24',hasta:'2027-02-25',pond:1},{n:'Reunión con la Oficina Sudamericana de la OACI',d:true,resp:'DGAC',desde:'2026-02-25',hasta:'2026-02-27',   {id:'i.28',eje:'Eje 7 – Verde y Sostenible',intv:'Ley de Fomento a las Energias Verdes',min:'Ministerio de Hidrocarburos y Energías',minConc:'Ministerio de Planificación del Desarrollo y Medio Ambiente Ministerio de Economia y Finanzas Publicas',ind:'Índice de Avance del Anteproyecto de Ley de Fomento de Energias Verdes',meta:'Alcanzar el 100% del proceso, con normas de energía, forestal y agua publicadas e implementadas',lb:'',freq:'Mensual',fuentes:'Diagnóstico marcos normativos; normas publicadas en Gaceta; reportes implementación regulatoria sectorial',desc:'Elaborar el Anteproyecto de Ley de Fomento de las Energias Verdes mediante el análisis técnico-legal del sector energético y la formulación de lineamientos para el desarrollo de energías verdes. Como resultado, se espera contar con un instrumento técnico-jurídico que establezca el marco normativo para promover la ejecución de proyectos de Energias Verdes.',obj:'El Proyecto de Ley de Fomento de Energías Verdes surge como respuesta a la necesidad de transformar progresivamente la matriz energética nacional, caracterizada por una alta dependencia de combustibles fósiles, hacia un modelo diversificado, sostenible y con menor intensidad de carbono. En este contexto, la propuesta normativa se configura como un instrumento estratégico de política pública orientado a impulsar la diversificación energética, promoviendo el desarrollo de proyectos de Energías Verdes. Asimismo, el Proyecto de Ley busca generar condiciones habilitantes para la inversión pública y privada, tanto nacional como extranjera, facilitando el acceso a financiamiento y estableciendo incentivos adecuados para el desarrollo de proyectos sostenibles',fecha:'08/06/2026',attr:'Con al menos una subetapa cumplida',prio:'Ley de Fomento a las Energias Verdes',iae:0,subsCum:0,subsTotal:26,ets:['Diagnóstico marcos normativos','Elaboración del borrador de Anteproyecto de Ley','Socialización Interna del Proyecto de Ley','Socialización preliminar del Proyect   {id:'i.29',eje:'Eje 1 – Bolivia economía para la gente',intv:'Ley Marco de Transición Energética y Soberanía No Hidrocarburífera en Bolivia',min:'Ministerio de Hidrocarburos y Energías',minConc:'Ministerio de Planificación del Desarrollo; Ministerio de Medio Ambiente y Agua; Ministerio de Economía y Finanzas Públicas; ENDE Corporación; Ministerio de Justicia y Transparencia Institucional; Ministerio de la Presidencia',ind:'Índice de Avance del Proceso de Elaboración y Aprobación de la Ley Marco de Transición Energética y Soberanía No Hidrocarburífera',meta:'Alcanzar el 100% del proceso: Ley Marco de Transición Energética promulgada, reglamentada y operativa, con marco regulatorio de energías renovables vigente y autoridad regulatoria sectorialmente funcional para 2027.',lb:'(N° etapas ejecutadas / 6) × 100 → 0%',freq:'Mensual',fuentes:'Gaceta Oficial del Estado Plurinacional; ENDE Corporación; AETN (Autoridad de Fiscalización de Electricidad y Tecnología Nuclear); informes del Ministerio de Hidrocarburos y Energías; CNDC; estadísticas de generación eléctrica INE; reportes de renovables y BESS.',desc:'Desarrollar la reforma legislativa estructural del sector energético boliviano que establece el marco jurídico para la generación, transmisión y distribución de energías renovables no convencionales (NCRE), contratos PPA a largo plazo, modernización de redes inteligentes (Smart Grids), almacenamiento con litio (BESS) y eficiencia energética; desplazando la dependencia hidrocarbúrífera del Sistema Interconectado Nacional (SIN).',obj:'Este anteproyecto busca definir un marco regulatorio que supervisa las actividades de la Industria Eléctrica que comprende: generación, transmisión, distribución, almacenamiento y comercialización; y los intercambios internacionales de electricidad; establecer los principios para la fijación de precios y tarifas de electricidad en todo el territorio nacional. Regular el cambio hacia un sistema más eficiente y limpio mediante la incorporación de fuentes renovables de energía con el objetivo de diversificar la matriz energética y establecer medidas de eficiencia para la diversificación energética, así como el establecimiento de un régimen de transacciones de compraventa de electricidad basado en el nuevo modelo de la Industria Eléctrica.',fecha:'27/07/2026',prio:'Ley de Electricidad',iae:27.6,subsCum:8,subsTotal:29,ets:['Diagnóstico normativo','Elaboración de Anteproyecto de Ley','Gestión del Anteproyecto de Ley','Socialización del Anteproyecto de Ley con diferentes actores externos. Con el fin de presentar los principales aspectos de la Ley.','Gestión de aprobación de la Ley en la Asamblea Legislativa Plurinacional','Promulgación de Ley por parte del Ejecutivo','Gestiones para Reglamentación'],etsPer:['✅ Completado','✅ Completado','⬜ Pendiente','⬜ Pendiente','⬜ Pendiente','⬜ Pendiente','⬜ Pendiente'],etsPond:[50,70,80,90,90,50,90],etaSubs:[[{n:'Recolección de la información',d:true,resp:'MHE/Viceministerio de Electricidad y Energías Renovables',desde:'2025-12-04',hasta:'2026-02-10',pond:25},{n:'Propuesta de Borrador',d:true,resp:'MHE/Viceministerio de Electricidad y Energías Renovables',desde:'2026-02-11',hasta:'2026-03-20',pond:25}],[{n:'Informe técnico',d:true,resp:'MHE/Viceministerio de Electricidad y Energías Renovables',desde:'2026-05-05',hasta:'2026-05-05',pond:60},{n:'Informe Legal',d:true,resp:'MHE/Viceministerio de Electricidad y Energías Renovables',desde:'2026-05-05',hasta:'2026-05-06',pond:60},{n:'Presentación de Propuesta MAE MHE y posterior remisión al Ministerio de la Presidencia (MINPRE)',d:true,resp:'MHE/Viceministerio de Electricidad y Energías Renovables',desde:'2026-05-06',hasta:'2026-05-06',pond:50}],[{n:'Presentación del Anteproyecto a UDAPE, reuniones de socialización, coordinación y revisión del Anteproyecto de Ley con actores directos',d:true,resp:'MHE/Viceministerio de Electricidad y Energías Renovables',desde:'2026-05-07',hasta:'2026-07-09',pond:50},{n:'Presentación de Propu   {id:'i.30',eje:'Eje 1 – Bolivia economía para la gente',intv:'Adecuación de las autorizaciones transitorias especiales (ATE´s) a Contratos Mineros (CAM) mediante procedimiento simplificado a cargo de la AJAM',min:'Ministerio de Minería y Metalurgia',minConc:'Ministerio de Planificación del Desarrollo y Medio Ambiente (Unidad de Análisis de Políticas Sociales y Económicas UDAPE)',ind:'Incremento de la formalización y continuidad de operaciones mineras mediante la adecuación de ATE´s a Contratos Administrativos Mineros.',meta:'Resolución Ministerial de reglamentación para la adecuación de ATE´s a Contratos Administrativos Mineros aprobado, promulgado y publicado.',lb:'(N° etapas ejecutadas / 6) × 100 → 0%',freq:'Mensual',fuentes:'Registros AJAM; informes jurídicos; resoluciones del Ministerio de Minería',desc:'Desarrollar de manera ordenada el proceso iniciado hace más de una década, dando certeza a los 3.982 derechos mineros preconstituidos y permitiendo al Estado ejercer un control efectivo; respetándose lo establecido en la Disposición Transitoria Octava de la CPE, garantizado la continuidad de los derechos bajo el nuevo régimen contractual. En en el marco de la normativa vigente, se instruirá a todos los actores del sector minero que, dentro de los sesenta (60) días calendario de la entrada en vigencia de eta norma, presenten su solicitud para la adecuación de sus Autorizaciones Transitorias Especiales (ATE´s) a Contratos Administrativos Mineros (CAM), conforme lo establece la Resolución Ministerial N. 282 de 31 de octubre de 2025, actualmente en vigor. A tal efecto, el Ministerio de Minería y Metalurgia (MMM) emitirá una nueva Resolución Ministerial que, sin modificar los articulos pertinentes de la Ley N. 535 encomendará a la Autoridad Jurisdiccional Administrativa Minera (AJAM) la elaboración en un procedimiento administrativo simplificado. Dicho procedimiento será íntegramente reglamentado y ejecutado por la AJAM en el ámbito de sus competencias.',obj:'Concluir el proceso de adecuación de las Autorizaciones Transitorias Especiales (ATE\'s) a Contratos Administrativos Mineros (CAM) mediante la aplicación de un procedimiento simplificado, fortaleciendo la seguridad jurídica, el control estatal de la actividad minera y la consolidación del régimen contractual previsto en la Ley N° 535.',fecha:'10/06/2026',prio:'Adecuación de las autorizaciones transitorias especiales (ATE´s) a Contratos Mineros (CAM) mediante procedimiento simplificado a cargo de la AJAM',iae:71.4,subsCum:5,subsTotal:7,ets:['Diagnóstico de Autorizaciones de ATE/CAM pendientes de adecuación','Diseño del procedimiento simplificado','Validación jurídica','Aprobación R.M. N° 069/2026','Implementación AJAM','Evaluación resultados'],etsPer:['✅ Completado','✅ Completado','✅ Completado','✅ Completado','⬜ Pendiente','⬜ Pendiente'],etsPond:[60,50,80,100,80,50],etaSubs:[[{n:'Sin subetapas registradas',d:true,resp:'Ministerio de Minería y Metalurgia',desde:'Sin subetapas registradas',hasta:'Sin subetapas registradas',pond:1}],[{n:'Borrador de RM',d:true,resp:'Ministerio de Minería y Metalurgia',desde:'2026-02-20',hasta:'2026-03-16',pond:25},{n:'Aprobación',d:true,resp:'Ministerio de Minería y Metalurgia',desde:'2026-03-17',hasta:'2026-03-31',pond:25}],[{n:'Sin subetapas registradas',d:true,resp:'Ministerio de Minería y Metalurgia',desde:'Sin subetapas registradas',hasta:'Sin subetapas registradas',pond:1}],[{n:'Sin subetapas registradas',d:true,resp:'Ministerio de Minería y Metalurgia',desde:'Sin subetapas registradas',hasta:'Sin subetapas registradas',pond:1}],[{n:'Sin subetapas registradas',d:false,ec:true,resp:'Ministerio de Minería y Metalurgia',desde:'Sin subetapas registradas',hasta:'Sin subetapas registradas',pond:1}],[{n:'Sin subetapas registradas',d:false,ec:true,resp:'Ministerio de Minería y Metalurgia',desde:'Sin subetapas registradas',hasta:'Sin subetapas registradas',pond:1}]],etaDates:[{desde:'2025-12-01',hasta:'2025-12-19',resp:'Ministerio de Minería y   {id:'i.31',eje:'Eje 2 – Bolivia al Mundo y el mundo a Bolivia',intv:'Reposicionamiento de Bolivia en el mapa minero global - PDAC 2026',min:'Ministerio de Minería y Metalurgia',minConc:'[ Sin ministerios concurrentes – completar si aplica ]',ind:'Índice de Avance del Proceso de Posicionamiento Minero Internacional',meta:'Alcanzar el 100% del proceso, con compromisos de inversión formalizados post-PDAC 2026',lb:'(N° etapas ejecutadas / 6) × 100 → 0%',freq:'Mensual',fuentes:'Acreditación PDAC 2026; empresas extranjeras interesadas en realizar inversión en Bolivia; cartas de intención; compromisos formalizados',desc:'Lograr La participación del nuevo Gobierno del Estado Plurinacional de Bolivia, desde el Ministerio de Minería y Metalurgia, en el PDAC (Prospectors & Developers Association of Canada) reviste una relevancia estratégica de alto nivel, al constituirse en una señal política internacional clara, inequívoca y contundente hacia la comunidad minera y financiera global. Luego de varios años de ausencia o de participación limitada del Estado boliviano, el retorno oficial de Bolivia al PDAC como Estado implica un cambio sustantivo en la política minera internacional del país. En Bolivia hay un cambio de modelo de la economía estatista hacia un modelo donde la participacion del sector privado retoma importancia, por ello, la presencia activa de Bolivia en el PDAC constituye un acto estratégico de reposicionamiento del Estado, orientado a restablecer credibilidad, generar confianza y proyectar una nueva visión de minería responsable, moderna y abierta a la inversión, con reglas claras, seguridad jurídica y compromiso con el desarrollo sostenible.',obj:'Promover internacionalmente el potencial minero de Bolivia mediante su participación estratégica en eventos especializados del sector, generando espacios de relacionamiento con potenciales inversionistas y fortaleciendo la visibilidad del país como destino atractivo para la exploración, desarrollo e inversión minera.   {id:'i.32',eje:'Eje 1 – Bolivia economía para la gente',intv:'Nueva Ley de Minería',min:'Ministerio de Minería y Metalurgia',minConc:'Ministerio de Presidencia',ind:'Mayor número de operaciones mineras en ejercicio. Mayor numero de empresas privadas o del exterior operando en Bolivia. Incremento en el monto de atracción de inversión. Reducción en uso de mercurio. Increménto en recaudaciónes de aportes en regalías.',meta:'Nueva Ley Minera',lb:'(N° etapas ejecutadas / 6) × 100 → 0%',freq:'Mensual',fuentes:'Ley N. 535 de Minería y Metalurgia',desc:'Elaborar, la nueva ley Minera a partir de un diagnósitoc sobre las prohibiciones actuales han sido y siguen siendo un obstáculo para el desarrollo tecnológico y finanaciero del sector cooperativo. La posibilidad de asociarse con la empresa privada (nacional o extranjera) bajo modalidades contractuales claras (como contratos de servicios, de riesgo compartido o de transferencia tecnológica) permitirá a las cooperativas acceder a capital para modernizar sus operaciones, adoptar tecnologías limpias para erradicar el uso de mercurio, mejorar sus índices de seguridad y productividad y formalizar las relaciones laborales. Esta propueta, lejos de neutralizar el cooperativismo, lo fortalece al permitirle competir en igualdad de condiciones, maximizando el valor del oro y otros minerales que producen, en beneficio de sus asociados y del mismo Estado. Se aclara que esta asociación no implica la pérdida de la titularidad del derercho minero por parte de la cooperativa que debe ser normado claramente. Modificación artículos 151 y 152 de la Ley N. 535 de Minería y Metalurgia',obj:'Fortalecer el marco normativo del sector minero mediante la elaboración, concertación y validación de propuestas legislativas orientadas a promover la inversión, otorgar mayor seguridad jurídica y modernizar la regulación minera nacional, incluyendo la construcción participativa de una nueva Ley de Minería y Metalurgia.',fecha:'10/06/2026',prio:'Nueva Ley de (function buildGroups(){

  groups.forEach(function(g, gi){
    var matchItems = g.items.filter(function(x){
      return !q || ns(x.id+' '+(x.prio||x.intv)+' '+g.min).indexOf(q)>=0;
    });
    if(!matchItems.length) return;
    vg++; vi+=matchItems.length;

    var isOpen = !!q || g.items.some(function(x){ return x.id===_sel; });
    var hasSel = g.items.some(function(x){ return x.id===_sel; });
    var minDisplay = 'Ministerio ' + shortMin(g.min);

    var div=document.createElement('div');
    div.className='mg';

    var btn=document.createElement('button');
    btn.className='mg-btn'+(hasSel?' has-selected':'');
    btn.id='mg-btn-'+gi;
    btn.innerHTML=
      '<span class="mg-arr'+(isOpen?' open':'')+'" id="mg-arr-'+gi+'">▶</span>'+
      '<span class="mg-name">'+esc(minDisplay)+'</span>'+
      '<span class="mg-ct">'+matchItems.length+'</span>';
    btn.onclick=function(){ toggleG(gi); };

    var ul=document.createElement('div');
    ul.className='mg-items'+(isOpen?' open':'');
    ul.id='mg-items-'+gi;

    matchItems.forEach(function(x){
      var p=x.iae||0; var c=sc(p,x.subsTotal||0,x.attr||'');
      var dotColor={V:'var(--sv)',A:'var(--sa)',R:'var(--sr)',N:'#555',B:'#ccc'}[c];
      var li=document.createElement('div');
      li.className='ii'+(x.id===_sel?' sel':'');
      li.setAttribute('data-id',x.id);
      li.innerHTML=
        '<span class="ii-dot" style="background:'+dotColor+'"></span>'+
        '<span class="ii-id">'+esc(x.id)+'</span>'+
        '<span class="ii-name">'+esc((x.prio||x.intv).substring(0,50))+'</span>'+
        '<span class="ii-pct">'+p.toFixed(0)+'%</span>';
      li.onclick=function(){ pick(x.id); };
      ul.appendChild(li);
    });

    div.appendChild(btn);
    div.appendChild(ul);
    list.appendChild(div);
  });

  var meta=document.getElementById('sb-meta');
  meta.textContent = q
    ? vi+' resultado'+(vi!==1?'s':'')+' en '+vg+' ministerio'+(vg!==1?'s':'')
    : '14 ministerios · 34 intervenciones';
}

function toggleG(gi){
  var ul=document.getElementById('mg-items-'+gi);
  var ar=document.getElementById('mg-arr-'+gi);
  if(!ul)return;
  var o=ul.classList.contains('open');
  ul.classList.toggle('open',!o);
  if(ar)ar.classList.toggle('open',!o);
}

function doSearch(){ renderSidebar(_groups, ns(document.getElementById('q').value)); }

function pick(id){
  _sel=id;
  var x=IND.filter(function(i){ return i.id===id; })[0];
  if(x) renderFicha(x);
  renderSidebar(_groups, ns(document.getElementById('q').value));
  document.getElementById('panel').scrollTop=0;
}

// ── RENDER FICHA ──────────────────────────────────────────────────────────
function renderFicha(x){
  var p=x.iae||0, c=sc(p,x.subsTotal||0,x.attr||'');
  var cum=x.subsCum||0, tot=x.subsTotal||0;
  var etDone=(x.etsPer||[]).filter(function(s){ return s.indexOf('✅')>=0; }).length;
  var nEt=(x.ets||[]).length;
  var h='';

  h+='<div class="fh"><div class="fh-top">';
  h+='<div class="fh-main">';
  h+='<div class="fh-row1"><span class="fh-id">'+esc(x.id)+'</span><span class="fh-eje">'+esc(x.eje)+'</span></div>';
  h+='<div class="fh-prio">'+esc(x.prio||x.intv)+'</div>';
  if(x.prio&&x.intv&&x.prio!==x.intv)
    h+='<div class="fh-intv">'+esc(x.intv)+'</div>';
  h+='<div class="fh-mins">';
  h+='<div class="fh-min-row"><span class="fh-min-lbl">Ministerio Responsable</span><span class="fh-min-val">'+esc(x.min)+'</span></div>';
  if(x.minConc&&x.minConc.toLowerCase()!=='ninguno'&&x.minConc.trim())
    h+='<div class="fh-min-row fh-conc-row"><span class="fh-min-lbl">Ministerios Concurrentes</span><span class="fh-conc-val">'+esc(x.minConc)+'</span></div>';
  h+='</div>';
  h+='</div>';
  h+='<div class="fh-iae-box">';
  h+='<div class="fh-iae-n">'+p.toFixed(1)+'<sup class="fh-iae-sup">%</sup></div>';
  h+='<div class="fh-iae-lbl">Índice de Avance</div>';
  h+='<div class="fh-subs">'+cum+' / '+tot+' subetapas</div>';
  h+='<div class="fh-sem"><span class="sem sem-'+c+'"><span class="sem-dot"></span>'+se(c)+' '+sl(c)+'</span></div>';
  if(x.fecha){
    h+='<div class="fh-fecha"><span class="fh-fecha-lbl">Última validación</span><span class="fh-fecha-val">'+esc(x.fecha)+'</span></div>';
  } else {
    h+='<div class="fh-fecha fh-fecha-none"><span class="fh-fecha-lbl">Última validación</span><span class="fh-fecha-none-val">Sin actualizar</span></div>';
  }
  h+='</div></div>';
  if(x.obj&&x.obj.trim()){
    h+='<div class="fh-obj">';
    h+='<span class="fh-obj-lbl">Objetivo</span>';
    h+='<span class="fh-obj-txt">'+esc(x.obj)+'</span>';
    h+='</div>';
  }
  h+='</div>';

  h+='<div class="prog">';
  h+='<div class="prog-row"><span class="prog-lbl">Avance por subetapas</span><span class="prog-val">'+p.toFixed(1)+'%</span></div>';
  h+='<div class="prog-bar"><div class="pf pf-'+c+'" style="width:'+Math.min(p,100)+'%"></div></div>';
  h+='<div class="prog-stats">';
  h+='<div class="ps"><div class="ps-n">'+cum+'</div><div class="ps-l">Subetapas cumplidas</div></div>';
  h+='<div class="ps"><div class="ps-n">'+tot+'</div><div class="ps-l">Total subetapas</div></div>';
  h+='<div class="ps"><div class="ps-n">'+etDone+'/'+nEt+'</div><div class="ps-l">Etapas completadas</div></div>';
  h+='</div></div>';

  h+='<div class="et-hdr">';
  h+='<span class="et-ttl">Ciclo de etapas · '+nEt+' etapas · '+tot+' subetapas</span>';
  h+='<div class="et-acts">';
  h+='<button class="btn-xs" onclick="xAll(true)">Expandir todo</button>';
  h+='<button class="btn-xs" onclick="xAll(false)">Colapsar todo</button>';
  h+='</div></div>';
  h+='<div class="et-leg"><span class="lg"><i>✅</i>Concluido</span><span class="lg"><i>🔵</i>En curso</span><span class="lg"><i>⬜</i>No iniciado</span></div>';

  (x.ets||[]).forEach(function(etName,ei){
    var per=(x.etsPer&&x.etsPer[ei])||'⬜ Pendiente';
    var subs=(x.etaSubs&&x.etaSubs[ei])||[];
    var dates=(x.etaDates&&x.etaDates[ei])||{};
    var done=per.indexOf('✅')>=0;
    var sd=subs.filter(function(s){ return s.d; }).length;
    var st=subs.length;
    var ep=st>0?Math.round(sd/st*100):(done?100:0);
    var ec=sc(ep,st);

    h+='<div class="eta-card">';
    h+='<div class="eta-row" id="er-'+ei+'" onclick="toggleE('+ei+')">';
    h+='<span class="eta-badge">Etapa '+(ei+1)+'</span>';
    h+='<span class="eta-icon">'+(done?'✅':'⬜')+'</span>';
    h+='<span class="eta-name">'+esc(etName)+'</span>';
    h+='<div class="eta-right">';
    if(st>0){
      h+='<div class="eta-mini"><div class="eta-mini-f emf-'+ec+'" style="width:'+ep+'%"></div></div>';
      h+='<span class="eta-prog">'+sd+'/'+st+' subs</span>';
    }
    if(dates.desde&&dates.hasta)
      h+='<span class="eta-dates">'+fd(dates.desde)+' – '+fd(dates.hasta)+'</span>';
    h+='</div>';
    if(dates.resp&&dates.resp.trim())
      h+='<span class="eta-resp">'+esc(dates.resp)+'</span>';
    h+='<span class="eta-chev">▼</span>';
    h+='</div>';

    h+='<div class="subs" id="sb-'+ei+'">';
    if(st>0){
      h+='<table><thead><tr>';
      h+='<th class="c"></th><th>Subetapa</th><th class="wr">Responsable</th><th class="wd">Inicio</th><th class="wd">Fin</th>';
      h+='</tr></thead><tbody>';
      subs.forEach(function(s,si){
        h+='<tr class="'+(s.d?'done-row':(s.ec?'prog-row':''))+'">';
        h+='<td class="c">'+(s.d?'✅':(s.ec?'🔵':'⬜'))+'</td>';
        h+='<td><span class="s-num">Sub '+(si+1)+'</span><span class="s-name">'+esc(s.n)+'</span></td>';
        h+='<td class="s-resp">'+esc(s.resp||'—')+'</td>';
        h+='<td class="s-date">'+fd(s.desde)+'</td>';
        h+='<td class="s-date">'+fd(s.hasta)+'</td>';
        h+='</tr>';
      });
      h+='</tbody></table>';
    }else{
      h+='<p style="padding:11px 16px;font-size:.77rem;color:#aaa;font-style:italic">Sin subetapas registradas — etapa evaluada por estado general</p>';
    }
    h+='</div></div>';
  });

  document.getElementById('panel').innerHTML=h;
}

function toggleE(ei){
  var r=document.getElementById('er-'+ei);
  var s=document.getElementById('sb-'+ei);
  if(!r||!s)return;
  var o=r.classList.contains('open');
  r.classList.toggle('open',!o);
  s.classList.toggle('open',!o);
}
function xAll(open){
  document.querySelectorAll('.eta-row').forEach(function(r,i){
    r.classList.toggle('open',open);
    var s=document.getElementById('sb-'+i);
    if(s) s.classList.toggle('open',open);
  });
}

</script>
</body>
</html>
